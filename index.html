<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Wildlife Detector – upload an image and detect animals using AI object detection." />
  <title>Wildlife Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --text-dim:  #8b949e;
      --accent:    #2dd4a8;
      --accent-lo: rgba(45, 212, 168, .12);
      --danger:    #f85149;
      --radius:    14px;
      --shadow:    0 8px 30px rgba(0,0,0,.45);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeDown .5s ease-out both;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -.5px;
      background: linear-gradient(135deg, var(--accent), #34d399, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: var(--text-dim);
      margin-top: .4rem;
      font-size: .95rem;
    }

    /* ── Card ─────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      animation: fadeUp .5s ease-out both;
    }

    /* ── Drop Zone ────────────────────────────────────── */
    .dropzone {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--accent);
      background: var(--accent-lo);
    }
    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .dropzone-icon {
      font-size: 2.5rem;
      margin-bottom: .6rem;
    }
    .dropzone-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: .3rem;
    }
    .dropzone-sub {
      color: var(--text-dim);
      font-size: .85rem;
    }

    /* ── Image Preview ────────────────────────────────── */
    .preview-wrapper {
      margin-top: 1.25rem;
      display: none;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .preview-wrapper img {
      width: 100%;
      display: block;
    }
    .preview-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,.65);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }
    .preview-remove:hover { background: var(--danger); }

    /* ── Slider ────────────────────────────────────────── */
    .slider-group {
      margin-top: 1.5rem;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      color: var(--text-dim);
      margin-bottom: .45rem;
    }
    .slider-label .val {
      color: var(--accent);
      font-weight: 600;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      transition: background .2s;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(45,212,168,.5);
      transition: transform .15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(45,212,168,.5);
    }

    /* ── Button ────────────────────────────────────────── */
    .detect-btn {
      margin-top: 1.5rem;
      width: 100%;
      padding: .85rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      color: #0d1117;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      display: none;
    }
    .detect-btn:hover:not(:disabled) {
      opacity: .9;
      transform: translateY(-1px);
    }
    .detect-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* ── Error Message ─────────────────────────────────── */
    .error-msg {
      margin-top: 1rem;
      padding: .75rem 1rem;
      background: rgba(248,81,73,.1);
      border: 1px solid rgba(248,81,73,.35);
      border-radius: 10px;
      color: var(--danger);
      font-size: .88rem;
      display: none;
    }

    /* ── Results ───────────────────────────────────────── */
    .results {
      width: 100%;
      max-width: 680px;
      margin-top: 1.5rem;
      display: none;
      animation: fadeUp .4s ease-out both;
    }
    .results canvas {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: block;
    }
    .summary {
      margin-top: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      font-size: .92rem;
      line-height: 1.7;
    }
    .summary .stat {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      margin-right: 1.2rem;
    }
    .summary .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .summary .highlight {
      color: var(--accent);
      font-weight: 600;
    }
    .summary .empty-msg {
      color: var(--text-dim);
    }

    /* ── Animations ────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 500px) {
      .card { padding: 1.25rem; }
      .dropzone { padding: 2rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>🐾 Wildlife Detector</h1>
    <p>Upload an image and detect animals with AI</p>
  </div>

  <!-- Main Card -->
  <div class="card" id="card">
    <!-- Drop zone -->
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" />
      <div class="dropzone-icon">📷</div>
      <div class="dropzone-title">Drag &amp; drop an image here</div>
      <div class="dropzone-sub">or click to browse &bull; JPG, PNG, WEBP</div>
    </div>

    <!-- Image preview -->
    <div class="preview-wrapper" id="previewWrapper">
      <img id="previewImg" alt="Preview" />
      <button class="preview-remove" id="removeBtn" title="Remove image">&times;</button>
    </div>

    <!-- Confidence slider -->
    <div class="slider-group">
      <div class="slider-label">
        <span>Confidence threshold</span>
        <span class="val" id="confVal">0.25</span>
      </div>
      <input type="range" id="confSlider" min="0.1" max="0.9" step="0.05" value="0.25" />
    </div>

    <!-- Detect button -->
    <button class="detect-btn" id="detectBtn">Detect Animals</button>

    <!-- Error area -->
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Results -->
  <div class="results" id="results">
    <canvas id="canvas"></canvas>
    <div class="summary" id="summary"></div>
  </div>

  <script>
    /* ── Element references ───────────────────────────── */
    const dropzone       = document.getElementById('dropzone');
    const fileInput      = document.getElementById('fileInput');
    const previewWrapper = document.getElementById('previewWrapper');
    const previewImg     = document.getElementById('previewImg');
    const removeBtn      = document.getElementById('removeBtn');
    const confSlider     = document.getElementById('confSlider');
    const confVal        = document.getElementById('confVal');
    const detectBtn      = document.getElementById('detectBtn');
    const errorMsg       = document.getElementById('errorMsg');
    const resultsDiv     = document.getElementById('results');
    const canvas         = document.getElementById('canvas');
    const summaryDiv     = document.getElementById('summary');

    let selectedFile = null;

    /* ── Color palette for classes ────────────────────── */
    const CLASS_COLORS = [
      '#2dd4a8', '#f59e0b', '#3b82f6', '#ef4444', '#a855f7',
      '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16',
      '#06b6d4', '#e11d48', '#8b5cf6', '#10b981', '#facc15',
    ];
    const classColorMap = {};
    let colorIndex = 0;
    function colorForClass(cls) {
      if (!classColorMap[cls]) {
        classColorMap[cls] = CLASS_COLORS[colorIndex % CLASS_COLORS.length];
        colorIndex++;
      }
      return classColorMap[cls];
    }

    /* ── Helpers ──────────────────────────────────────── */
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
    function hideError() {
      errorMsg.style.display = 'none';
    }

    function setReady(hasFile) {
      detectBtn.style.display = hasFile ? 'block' : 'none';
    }

    /* ── Slider ───────────────────────────────────────── */
    confSlider.addEventListener('input', () => {
      confVal.textContent = parseFloat(confSlider.value).toFixed(2);
    });

    /* ── Drag & drop ──────────────────────────────────── */
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (files.length) handleFile(files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    removeBtn.addEventListener('click', () => {
      selectedFile = null;
      previewWrapper.style.display = 'none';
      dropzone.style.display = 'block';
      fileInput.value = '';
      setReady(false);
      hideError();
      resultsDiv.style.display = 'none';
    });

    function handleFile(file) {
      const allowed = ['image/jpeg', 'image/png', 'image/webp'];
      if (!allowed.includes(file.type)) {
        showError('Invalid file type. Please upload a JPG, PNG, or WEBP image.');
        return;
      }
      hideError();
      selectedFile = file;

      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewWrapper.style.display = 'block';
        dropzone.style.display = 'none';
        setReady(true);
        resultsDiv.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    /* ── Detection ────────────────────────────────────── */
    detectBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      hideError();

      detectBtn.disabled = true;
      detectBtn.textContent = 'Detecting…';

      const conf = parseFloat(confSlider.value).toFixed(2);
      const form = new FormData();
      form.append('file', selectedFile);

      try {
        const res = await fetch(`http://127.0.0.1:8000/detect?conf=${conf}`, {
          method: 'POST',
          body: form,
        });

        if (!res.ok) {
          throw new Error(`Server responded with ${res.status} ${res.statusText}`);
        }

        const data = await res.json();
        renderResults(data);
      } catch (err) {
        if (err instanceof TypeError && err.message === 'Failed to fetch') {
          showError('Cannot reach the detection server at 127.0.0.1:8000 — is it running?');
        } else {
          showError(err.message || 'An unexpected error occurred.');
        }
      } finally {
        detectBtn.disabled = false;
        detectBtn.textContent = 'Detect Animals';
      }
    });

    /* ── Render results on canvas ─────────────────────── */
    function renderResults(data) {
      const { image_width, image_height, inference_ms, detections } = data;

      /* --- draw image then overlay ---- */
      const img = new Image();
      img.onload = () => {
        // Canvas at original resolution for quality
        canvas.width  = image_width;
        canvas.height = image_height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, image_width, image_height);

        // Scale factor — boxes are already in original image pixels, no extra
        // scaling needed since canvas matches original dims.
        const lineWidth = Math.max(2, Math.round(Math.min(image_width, image_height) / 300));
        const fontSize  = Math.max(12, Math.round(Math.min(image_width, image_height) / 55));

        detections.forEach(det => {
          const [x1, y1, x2, y2] = det.box;
          const color = colorForClass(det.class);
          const label = `${det.class} ${Math.round(det.confidence * 100)}%`;

          // Bounding box
          ctx.strokeStyle = color;
          ctx.lineWidth   = lineWidth;
          ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

          // Label background
          ctx.font = `600 ${fontSize}px Inter, sans-serif`;
          const tm = ctx.measureText(label);
          const pad = fontSize * 0.35;
          const lx = x1;
          const ly = y1;

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.roundRect(lx, ly, tm.width + pad * 2, fontSize + pad * 2, [0, 0, 6, 0]);
          ctx.fill();

          // Label text
          ctx.fillStyle = '#0d1117';
          ctx.fillText(label, lx + pad, ly + fontSize + pad * 0.8);
        });

        resultsDiv.style.display = 'block';
        buildSummary(detections, inference_ms);
      };
      img.src = previewImg.src;
    }

    /* ── Summary ──────────────────────────────────────── */
    function buildSummary(detections, inferenceMs) {
      if (detections.length === 0) {
        summaryDiv.innerHTML = `<span class="empty-msg">No animals detected at this confidence — try lowering the slider.</span>`;
        return;
      }

      // Count per class
      const counts = {};
      detections.forEach(d => { counts[d.class] = (counts[d.class] || 0) + 1; });

      let html = `<div style="margin-bottom:.5rem"><strong class="highlight">${detections.length}</strong> detection${detections.length > 1 ? 's' : ''} &nbsp;·&nbsp; inference <strong class="highlight">${inferenceMs.toFixed(1)} ms</strong></div>`;

      Object.entries(counts).forEach(([cls, n]) => {
        const c = colorForClass(cls);
        html += `<span class="stat"><span class="dot" style="background:${c}"></span>${cls}: <strong>${n}</strong></span>`;
      });

      summaryDiv.innerHTML = html;
    }
  </script>
</body>
</html>
